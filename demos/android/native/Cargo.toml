[package]
name = "encrypted-spaces-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "spaces_android"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
encrypted-spaces-sdk-codegen = { workspace = true }

[dependencies]
anyhow.workspace = true
base64.workspace = true
encrypted-spaces-sdk.workspace = true
native-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-native-tls.workspace = true
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
native-tls = { workspace = true, features = ["vendored"] }

[target.'cfg(not(target_os = "android"))'.dev-dependencies]
encrypted-spaces-sdk = { workspace = true, features = ["local-transport", "testing"] }
encrypted-spaces-ffproof = { workspace = true, features = ["prove"] }
